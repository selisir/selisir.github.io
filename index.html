<!DOCTYPE html>
<!--
  ============ GUIDA RAPIDA ============
  1. CONTENUTI (testi, link, progetti, skill, CV): modifica SOLO l'oggetto DATA in fondo al file.
  2. COLORI E FONT dei tre temi: variabili CSS all'inizio di <style>.
  3. STRUTTURA: sezioni <section> nel body (Home, About, Work, Projects, Skills, Contact).
  4. EFFETTI: glitter/scia (canvas), animazione cambio tema e "burst" al click sono nello script.
  Cerca le scritte "MODIFICA" per trovare i punti pensati per essere cambiati.
  ======================================
-->
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elisa Samaritani · Portfolio</title>
<style>
/* MODIFICA - VARIABILI DEI TEMI
   --bg sfondo | --fg testo | --mut testo secondario | --card sfondo riquadri
   --acc colore principale (link, bottoni, maglia del personaggio) | --bd bordi
   --font testo | --head titoli | --r arrotondamento angoli | --sh ombra */
/* DARK: terminale / neon */
:root{--bg:#0a0d0b;--fg:#d7e8dc;--mut:#7f978a;--card:#111812;--acc:#12D640;--bd:#1f3a27;--font:ui-monospace,Menlo,Consolas,monospace;--head:var(--font);--r:4px;--sh:0 0 18px #12d64022}
/* LIGHT: carta calda / editoriale */
[data-theme=light]{--bg:#fbf5ea;--fg:#2b2119;--mut:#7a6a5a;--card:#fffdf8;--acc:#e2673a;--bd:#eadfcb;--font:system-ui,sans-serif;--head:Georgia,'Times New Roman',serif;--r:18px;--sh:0 6px 20px #8a6a3a1a}
/* GLITTER: rosa tondo */
[data-theme=glitter]{--bg:#ffc9e4;--fg:#5a1f43;--mut:#a24f80;--card:#ffe6f2;--acc:#e0248f;--bd:#f59ac8;--font:'Trebuchet MS',system-ui,sans-serif;--head:var(--font);--r:26px;--sh:0 6px 24px #e0248f44}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--font);transition:background .4s,color .4s}
h1,h2,h3{font-family:var(--head);margin:0 0 .5em}
a{color:var(--acc);text-decoration:none;position:relative}
[data-theme=dark] body{background-image:linear-gradient(#12d64010 1px,transparent 1px),linear-gradient(90deg,#12d64010 1px,transparent 1px);background-size:36px 36px}
[data-theme=dark] h2::before{content:"> ";color:var(--acc)}
[data-theme=light] h2{font-style:italic}
[data-theme=glitter] a:hover::after{content:"✦ ✧ ✦";position:absolute;top:-1.1em;left:0;font-size:.75em;white-space:nowrap;animation:tw .5s infinite alternate}
@keyframes tw{to{opacity:.3;transform:translateY(-3px) rotate(8deg)}}
#sparkle{position:fixed;inset:0;pointer-events:none;z-index:2;display:none}
[data-theme=glitter] #sparkle{display:block}
nav{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:6px 18px;align-items:center;padding:10px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
nav .sp{flex:1}
nav a{color:var(--fg)}nav a:hover{color:var(--acc)}
.tb{background:var(--card);border:1px solid var(--bd);border-radius:999px;cursor:pointer;padding:3px 10px;font-size:1rem}
section{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:90px 20px 30px}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.typing{color:var(--acc);border-right:3px solid var(--acc);padding-right:4px;animation:bl .8s infinite}
@keyframes bl{50%{border-color:transparent}}
/* MODIFICA - colore capelli: uguale in tutti i temi (cambia solo la maglia, che usa --acc) */
:root{--hair:#3a2422}
.girl{width:190px;height:auto;filter:drop-shadow(0 6px 14px #0004)}
.hair{fill:var(--hair);transition:fill .4s}
.eyes{transform-origin:100px 102px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.btn{background:var(--acc);color:#fff;border:0;border-radius:var(--r);padding:12px 26px;font:inherit;cursor:pointer}
[data-theme=dark] .btn{color:#001a06}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{display:block;color:var(--fg);padding:0;overflow:hidden;transition:transform .2s}
.pc:hover{transform:translateY(-4px);border-color:var(--acc)}
.pc .im{height:150px;background:linear-gradient(135deg,var(--acc),var(--bd));display:flex;align-items:center;justify-content:center;font-size:2rem}
.pc img{width:100%;height:150px;object-fit:cover;display:block}
.pc h3{padding:12px 16px;margin:0;font-size:1.05rem}
.chip{display:inline-block;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:2px 14px;margin:4px 6px 4px 0}
.mut{color:var(--mut)}
.ic{display:flex;gap:14px;flex-wrap:wrap}
.ic a{display:flex;align-items:center;gap:8px;color:var(--fg);padding:10px 16px}
.ic svg{width:24px;height:24px;fill:currentColor}
.ic a:hover{color:var(--acc)}
.hide{display:none!important}
footer{text-align:center;padding:40px;color:var(--mut)}
</style>
</head>

/* tema */
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
const EMO={dark:['🌙','⭐','✨'],light:['☀️','🌼','✨'],glitter:['💖','✨','🌸']};
function setTheme(t,ev){
  if(t===document.documentElement.dataset.theme)return;
  if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches)return applyTheme(t);
  const r=ev.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>applyTheme(t)).ready.then(()=>document.documentElement.animate(
    {clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:700,easing:'ease-in-out',pseudoElement:'::view-transition-new(root)'}));
  burst(x,y,t,10);
}
/* MODIFICA - EFFETTO "BURST": emoji che escono dal punto cliccato, diverse per tema.
   Cambia le emoji in EMO, il numero (n) o la distanza (d). Si attiva al cambio tema e al click su link/bottoni/riquadri. */
function burst(x,y,t,n){
  for(let i=0;i<n;i++){const s=document.createElement('span'),a=Math.PI*2*i/n,d=50+Math.random()*60;
    s.textContent=EMO[t][i%3];s.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:99;pointer-events:none`;document.body.append(s);
    s.animate({transform:['translate(0,0)',`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.4)`],opacity:[1,0]},{duration:900,easing:'ease-out'}).onfinish=()=>s.remove()}
}
addEventListener('click',e=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||e.target.closest('.tb')||!e.target.closest('a,button,.card'))return;
  burst(e.clientX,e.clientY,document.documentElement.dataset.theme,6);
});

try{const t=localStorage.getItem('theme');if(t)applyTheme(t)}catch(e){}  /* ricorda il tema scelto */

function route(){

addEventListener('hashchange', route); route();

/* typing: cicla le parole di DATA.roles */

function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
const cols=['#fff','#ffd1ea','#ff5fb0','#ffe27a'];
function spawn(x,y,v){P.push({x,y,vx:(Math.random()-.5)*v,vy:Math.random()*v+.3,s:Math.random()*4+1,l:1,c:cols[Math.random()*4|0]})}
addEventListener('mousemove',e=>{if(document.documentElement.dataset.theme==='glitter')for(let i=0;i<3;i++)spawn(e.clientX,e.clientY,3)});
(function loop(){g.clearRect(0,0,cv.width,cv.height);
 if(document.documentElement.dataset.theme==='glitter'){
  if(Math.random()<.6)spawn(Math.random()*cv.width,-5,.6);
  P=P.filter(p=>p.l>0&&p.y<cv.height+10);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.004;g.globalAlpha=Math.max(p.l,0)*(.6+.4*Math.sin(p.y/8));g.fillStyle=p.c;
   g.beginPath();g.moveTo(p.x,p.y-p.s);g.lineTo(p.x+p.s/3,p.y-p.s/3);g.lineTo(p.x+p.s,p.y);g.lineTo(p.x+p.s/3,p.y+p.s/3);g.lineTo(p.x,p.y+p.s);g.lineTo(p.x-p.s/3,p.y+p.s/3);g.lineTo(p.x-p.s,p.y);g.lineTo(p.x-p.s/3,p.y-p.s/3);g.fill()})
 }else P=[];
 requestAnimationFrame(loop)})();
</script>
</body>
</html>
